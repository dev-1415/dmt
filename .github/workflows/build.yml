name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: lint
        run: ./gradlew :app:lintRelease

      - name: run unit tests
        run: ./gradlew testDebugUnitTest

      # Forks start without the signing secrets, so a plain build stays unsigned instead of
      # handing gradle an empty keystore.
      - name: decode keystore
        if: github.event_name != 'pull_request' && env.SIGNING_KEYSTORE != ''
        run: printf '%s' "$SIGNING_KEYSTORE" | base64 -d > dmt.keystore

      # Use the latest release's tag when there is one, otherwise the version in the build file.
      - name: resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh release view --json tagName --jq .tagName 2>/dev/null | sed 's/^v//' || true)
          if [ -z "$base" ]; then
            base=$(sed -n 's/.*versionOverride.*?: "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          fi
          echo "name=${base:-2.0.0}-ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: build
        env:
          SIGNING_KEYSTORE_PATH: dmt.keystore
        run: ./gradlew assembleRelease -PversionOverride=${{ steps.version.outputs.name }}

      - name: upload release apk
        uses: actions/upload-artifact@v7
        with:
          name: dmt-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
