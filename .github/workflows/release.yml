name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# One release per tag, and never cancel one halfway through publishing.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v6

      # Fail before building rather than publishing an unsigned apk.
      - name: check signing secrets
        run: |
          missing=0
          for name in SIGNING_KEYSTORE SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: resolve version
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: decode keystore
        run: printf '%s' "$SIGNING_KEYSTORE" | base64 -d > dmt.keystore

      - name: build signed release apk
        env:
          SIGNING_KEYSTORE_PATH: dmt.keystore
        run: ./gradlew assembleRelease -PversionOverride=${{ steps.version.outputs.name }}

      - name: build signed release aab
        env:
          SIGNING_KEYSTORE_PATH: dmt.keystore
        run: ./gradlew bundleRelease -PversionOverride=${{ steps.version.outputs.name }} -PabiSplits=false

      - name: verify signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$apksigner" verify --print-certs "$apk"
          done

      - name: write release notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag --list --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md

      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
